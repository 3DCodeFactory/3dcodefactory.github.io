<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison Verhoeven — The Restorer's Bench</title>
  <style>
    :root {
      --ink: #0b0805;
      --cream: #e8d9b8;
      --gold: #c49a56;
      --gold-dim: rgba(196, 154, 86, 0.55);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #090705; color: var(--cream);
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }
    #stage { position: fixed; inset: 0; }
    #stage canvas { display: block; width: 100%; height: 100%; outline: none; }
    .vignette-ui {
      pointer-events: none; position: fixed; inset: 0; z-index: 2;
      background: radial-gradient(ellipse at 52% 46%, transparent 52%, rgba(4, 2, 1, 0.22) 100%);
    }
    .ui { transition: opacity 1.2s cubic-bezier(.22,.61,.36,1); }
    .ui.hidden { opacity: 0; pointer-events: none; }

    .brand {
      position: fixed; left: clamp(22px, 3vw, 46px); top: clamp(20px, 3.1vh, 38px);
      z-index: 6; display: flex; align-items: center; gap: 13px;
      text-transform: uppercase; letter-spacing: .24em;
      filter: drop-shadow(0 2px 12px rgba(0,0,0,.85));
      user-select: none;
    }
    .brand .mark {
      width: 31px; height: 31px; border: 1px solid var(--gold-dim); border-radius: 50%;
      display: grid; place-items: center; color: var(--gold);
      font-size: 12px; letter-spacing: 0; transform: rotate(-7deg);
    }
    .brand .name { font-size: 11px; line-height: 1.35; color: #decba5; }
    .brand .name small {
      display: block; font-family: "Avenir Next", "Gill Sans", sans-serif;
      font-size: 7.5px; letter-spacing: .34em; color: rgba(232, 217, 184, .52); margin-top: 4px;
    }
    .hintbar {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      z-index: 6; display: flex; align-items: center; gap: 14px;
      padding: 10px 18px; border: 1px solid rgba(214, 181, 126, .2);
      border-radius: 100px; background: rgba(9, 7, 5, .52);
      box-shadow: 0 8px 32px rgba(0,0,0,.38); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font-family: "Avenir Next", "Gill Sans", sans-serif;
      font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
      color: rgba(232, 217, 184, .7); white-space: nowrap; user-select: none;
    }
    .hintbar .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--gold); opacity: .75; }
    .hintbar b { font-weight: 500; color: #f0dfbd; }
    .capture .ui, body.capture .brand, body.capture .hintbar, body.capture .focus-card { opacity: 0 !important; pointer-events: none !important; }

    .focus-card {
      position: fixed; right: clamp(20px, 2.6vw, 42px); bottom: 24px; z-index: 7;
      display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
      opacity: 0; transform: translateY(10px); pointer-events: none;
      transition: opacity .7s ease, transform .7s ease;
    }
    .focus-card.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .focus-card .eyebrow {
      font-family: "Avenir Next", "Gill Sans", sans-serif; font-size: 8px;
      letter-spacing: .28em; text-transform: uppercase; color: rgba(232,217,184,.5);
    }
    .focus-card button {
      appearance: none; cursor: pointer; border: 1px solid rgba(214,181,126,.33);
      background: rgba(13, 10, 7, .72); color: #ecdcba; padding: 11px 17px;
      font-family: "Avenir Next", "Gill Sans", sans-serif; font-size: 9px;
      letter-spacing: .18em; text-transform: uppercase; border-radius: 2px;
      backdrop-filter: blur(12px); transition: background .25s, border-color .25s;
    }
    .focus-card button:hover { background: rgba(44, 33, 20, .82); border-color: rgba(214,181,126,.7); }

    .tooltip {
      position: fixed; z-index: 9; pointer-events: none; padding: 7px 11px;
      border: 1px solid rgba(214,181,126,.24); border-radius: 2px;
      background: rgba(8,6,4,.82); color: #eadbbd; backdrop-filter: blur(8px);
      font-family: "Avenir Next", "Gill Sans", sans-serif; font-size: 9px;
      letter-spacing: .13em; text-transform: uppercase;
      opacity: 0; transform: translate(12px, 14px); transition: opacity .15s ease;
    }
    .tooltip.visible { opacity: 1; }

    .loader {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
      background: #090705; transition: opacity 1.25s ease, visibility 1.25s ease;
      pointer-events: none;
    }
    .loader.done { opacity: 0; visibility: hidden; }
    .loader-inner { text-align: center; color: var(--gold); }
    .loader-sigil {
      width: 44px; height: 44px; margin: 0 auto 17px; border: 1px solid rgba(196,154,86,.5);
      border-radius: 50%; position: relative; animation: rotateSigil 5s linear infinite;
    }
    .loader-sigil::before, .loader-sigil::after {
      content: ""; position: absolute; inset: 8px; border: 1px solid rgba(196,154,86,.28); border-radius: 50%;
    }
    .loader-sigil::after { inset: 17px; background: rgba(196,154,86,.7); border: 0; }
    @keyframes rotateSigil { to { transform: rotate(360deg); } }
    .loader-title {
      font-size: 12px; letter-spacing: .35em; text-transform: uppercase; color: #d9c39b;
      margin-bottom: 8px;
    }
    .loader-sub {
      font-family: "Avenir Next", "Gill Sans", sans-serif; font-size: 8px; letter-spacing: .24em;
      text-transform: uppercase; color: rgba(217,195,155,.38);
    }
    @media (max-width: 720px) {
      .brand { display: none; }
      .hintbar { font-size: 8px; max-width: calc(100% - 28px); padding: 9px 13px; gap: 8px; }
      .hintbar .desktop-only { display: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="stage" aria-label="Interactive three dimensional watchmaker's workbench"></div>
  <div class="vignette-ui"></div>

  <header class="brand ui" aria-label="Atelier name">
    <span class="mark">MV</span>
    <span class="name">Maison Verhoeven<small>Restoration &amp; Horology · Paris 1907</small></span>
  </header>

  <div class="hintbar ui" id="hintbar">
    <span><b>Drag</b> a brass wheel</span><span class="dot"></span>
    <span><b>Click the loupe</b> to inspect the brooch</span><span class="dot desktop-only"></span>
    <span class="desktop-only"><b>Drag</b> to orbit · <b>Scroll</b> to draw near</span>
  </div>

  <div class="focus-card" id="focusCard">
    <div class="eyebrow">Loupe focus · Ruby &amp; platinum</div>
    <button id="returnButton" type="button">Return to the bench &nbsp;·&nbsp; Esc</button>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <div class="loader" id="loader">
    <div class="loader-inner">
      <div class="loader-sigil"></div>
      <div class="loader-title">Atelier Verhoeven</div>
      <div class="loader-sub">Kindling the workroom lamp</div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
<script src="../camera-limits.js"></script><script src="../scene-ui.js?v=20261114"></script></body>
</html>
