<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>三维模型查看器</title><link rel="icon" href="data:,">
<script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/examples/jsm/"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f2;font:12px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#40565d;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;gap:8px;pointer-events:none}#loading[hidden]{display:none}#loading b{font-size:14px;font-weight:500}#progress{color:#71838a;font-size:12px}
#toolbar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px;background:#ffffffed;border:1px solid #ffffffb3;border-radius:14px;box-shadow:0 4px 22px #243d4b12;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);white-space:nowrap;max-width:calc(100vw - 24px)}
.mode-group{display:flex;gap:3px}button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:8px 13px;font:inherit;font-weight:500;border:0;background:transparent;border-radius:9px;color:#6a7a81;cursor:pointer;transition:background .18s,color .18s}button:hover{background:#f0f4f4;color:#243c43}button[aria-pressed=true]{background:#263f46;color:#fff}button:focus-visible{outline:2px solid #287781;outline-offset:3px}button:disabled{opacity:.35;cursor:wait}button svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}#reset{border-left:1px solid #e6ebed;border-radius:0;padding:8px 10px;margin-left:1px}#reset:hover{color:#287781;background:transparent}
#hint{position:fixed;top:16px;right:18px;font-size:11px;color:#71838a;pointer-events:none}#toolbar[hidden]{display:none}@media(max-width:500px){#toolbar{bottom:12px;padding:5px;gap:4px;border-radius:12px}button{padding:8px 10px;font-size:11px;gap:6px}#hint{top:12px;right:12px;font-size:10px}}

#toolbar{gap:0;padding:0;border:0;border-radius:0;box-shadow:none;background:#e8eeea;backdrop-filter:none;-webkit-backdrop-filter:none}.mode-group{gap:0}#toolbar button{border-radius:0;box-shadow:none}#toolbar button[aria-pressed=true]{background:#a4e7da;color:#245d4e}#toolbar #reset{margin:0}
</style>
</head>
<body>
<div id="hint">拖拽旋转 · 滚轮缩放</div>
<div id="loading" role="status"><b>正在载入三维模型</b><span id="progress">读取场景与材质…</span></div>
<div id="toolbar" aria-label="模型显示方式">
 <div class="mode-group" role="group" aria-label="显示模式">
  <button data-mode="wire" disabled aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="m10 2 7 4v8l-7 4-7-4V6Zm0 0v16M3 6l14 8M17 6 3 14M3 6l7 4 7-4M3 14l7-4 7 4"/></svg>线框</button>
  <button data-mode="edges" disabled aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="m10 2 7 4v8l-7 4-7-4V6Zm-7 4 7 4 7-4M10 10v8"/></svg>边线</button>
  <button data-mode="render" disabled aria-pressed="false"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="m10 2 7 4v8l-7 4-7-4V6Z"/><path d="m10 10 7-4v8l-7 4Z" fill="currentColor" opacity=".35"/><path d="m3 6 7 4v8M10 10l7-4"/></svg>渲染</button>
 </div>
 <button id="reset" disabled title="复位视角" aria-label="复位视角"><svg aria-hidden="true" viewBox="0 0 20 20"><path d="M4 7a6.5 6.5 0 1 1-.3 5M4 3v4h4"/></svg></button>
</div>
<script type="module" src="viewer.js?v=20261115-wire-first"></script>
