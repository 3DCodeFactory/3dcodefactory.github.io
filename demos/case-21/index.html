<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#120e0a" />
  <meta name="description" content="La Chambre Fleurie — an editable, sunlit Art Nouveau bohemian salon in real-time WebGL." />
  <title>La Chambre Fleurie · Atelier Lumière</title>
  <link rel="stylesheet" href="./styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <div class="stage" id="stage">
      <canvas id="scene" aria-label="Interactive three-dimensional bohemian Art Nouveau salon"></canvas>
      <div class="stage-edge" aria-hidden="true"></div>
    </div>
  </div>

  <div class="ui-layer" id="uiLayer">
    <header class="brand">
      <svg class="brand-flourish" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M31 54C22 40 14 34 14 23c0-7 5-13 13-14 3 7 1 12-3 16-5 5-8 10-6 17 1 4 5 8 8 11 2 2 3 3 5 1z" />
        <path d="M33 54c9-14 17-20 17-31 0-7-5-13-13-14-3 7-1 12 3 16 5 5 8 10 6 17-1 4-5 8-8 11-2 2-3 3-5 1z" />
        <circle cx="32" cy="13" r="2.4" />
        <path d="M20 36c5-1 9 1 12 5M44 36c-5-1-9 1-12 5" />
      </svg>
      <div class="brand-text">
        <p class="brand-kicker">Atelier Lumière · No. 04</p>
        <h1>La Chambre Fleurie</h1>
        <p class="brand-sub">A bohemian salon in the late afternoon</p>
      </div>
    </header>

    <nav class="top-actions" aria-label="Scene actions">
      <button class="quiet-button" id="resetView" type="button" title="Return to the reference viewpoint">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8V5h3M19 8V5h-3M5 16v3h3M19 16v3h-3"/><circle cx="12" cy="12" r="3.1"/></svg>
        <span>Reference view</span>
      </button>
      <button class="save-button" id="savePng" type="button" title="Export the current scene as a 1536 × 1024 PNG">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg>
        <span>Save PNG</span>
      </button>
    </nav>

    <div class="left-note" aria-hidden="true">
      <span class="rule"></span>
      <span>Drag to wander<br />Scroll to step closer</span>
    </div>

    <section class="light-panel" aria-label="Time of day">
      <div class="panel-glow" aria-hidden="true"></div>
      <div class="panel-head">
        <div class="clock-wrap">
          <span class="clock" id="clock">4:48</span>
          <span class="clock-suffix" id="clockSuffix">pm</span>
        </div>
        <div class="period-wrap">
          <span class="eyebrow">The light</span>
          <span class="period" id="period">Golden hour</span>
        </div>
        <button class="drift-button" id="drift" type="button" aria-pressed="false" title="Let the afternoon unfold">
          <span class="drift-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20"><path d="M6.5 4.2v11.6L16 10 6.5 4.2z" /></svg>
          </span>
          <span class="drift-label">Sun drift</span>
        </button>
      </div>

      <div class="slider-row">
        <svg class="celestial sun" viewBox="0 0 30 30" aria-hidden="true">
          <circle cx="15" cy="15" r="5.2" />
          <path d="M15 2v3.4M15 24.6V28M2 15h3.4M24.6 15H28M5.8 5.8l2.4 2.4M21.8 21.8l2.4 2.4M24.2 5.8l-2.4 2.4M8.2 21.8l-2.4 2.4" />
        </svg>
        <div class="range-wrap">
          <input id="timeSlider" type="range" min="6" max="21" step="0.02" value="16.8"
            aria-label="Time of day, from six in the morning to nine at night" />
          <div class="range-marks" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <svg class="celestial moon" viewBox="0 0 30 30" aria-hidden="true">
          <path d="M23.7 17.6A9.7 9.7 0 1 1 13 4.2a7.7 7.7 0 0 0 10.7 13.4z" />
          <path d="M20.5 6.2l.7 1.6 1.6.7-1.6.7-.7 1.6-.7-1.6-1.6-.7 1.6-.7.7-1.6z" />
        </svg>
      </div>

      <div class="panel-foot">
        <div class="presets" role="group" aria-label="Light presets">
          <button class="preset" type="button" data-hour="6.7">First light</button>
          <button class="preset" type="button" data-hour="13">High sun</button>
          <button class="preset is-active" type="button" data-hour="16.8">Golden hour</button>
          <button class="preset" type="button" data-hour="20.25">Dusk</button>
        </div>
        <p class="micro-hint"><span class="pulse-dot" aria-hidden="true"></span>Change the hour · the flowers wake</p>
      </div>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <div class="loading" id="loading">
    <div class="loading-art" aria-hidden="true">
      <svg viewBox="0 0 120 160">
        <path class="stem" d="M60 150C52 116 48 90 56 64c5-16 12-28 10-46" />
        <path class="leaf" d="M57 112c-18-4-28-16-29-32 18 1 29 12 29 32z" />
        <path class="leaf" d="M59 88c16-5 25-17 24-33-17 3-26 14-24 33z" />
        <path class="leaf" d="M61 130c-14-1-23-9-27-21 14-1 24 6 27 21z" />
        <g class="flower">
          <circle cx="66" cy="41" r="7" />
          <path d="M66 34c-9-8-8-20 2-24 7 6 8 17-2 24z" />
          <path d="M72 38c10-5 19 2 18 12-9 4-17 0-18-12z" />
          <path d="M66 48c8 6 8 17-1 21-6-5-6-15 1-21z" />
          <path d="M58 40c-10 2-16-6-13-15 8-1 14 5 13 15z" />
        </g>
        <path class="swirl" d="M36 91c-14 6-20 18-12 27 5 6 13 5 14-2 1-5-6-8-9-3" />
        <path class="swirl" d="M84 72c13 3 20 12 15 21-4 7-13 6-14-1-1-5 7-8 10-3" />
      </svg>
    </div>
    <p class="loading-title">La Chambre Fleurie</p>
    <p class="loading-sub">Weaving the last light</p>
    <div class="loading-bar"><i></i></div>
  </div>

  <noscript>
    <div class="noscript">This little salon needs JavaScript and WebGL to open its doors.</div>
  </noscript>

  <script type="module" src="./js/main.js"></script>
<script src="../camera-limits.js"></script><script src="../scene-ui.js?v=20261114"></script></body>
</html>
