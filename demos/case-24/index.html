<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020303">
  <title>Bay 03 — Night Store</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app" aria-label="Interactive 3D warehouse"></div>

  <div class="grain-edge" aria-hidden="true"></div>

  <header class="ui ui-top">
    <div class="wordmark">
      <span class="wordmark-number">BAY 03</span>
      <span class="wordmark-rule"></span>
      <span class="wordmark-sub">NIGHT STORE</span>
    </div>
    <div class="slate" aria-hidden="true">
      <span class="rec"><i></i>REC</span>
      <span class="slate-div">/</span>
      <span>00:41:17</span>
      <span class="slate-div">/</span>
      <span>35 mm</span>
    </div>
  </header>

  <div class="ui ui-bottom">
    <div class="instructions">
      <span class="instruction"><b>MOVE</b> torch</span>
      <span class="instruction"><b>DRAG</b> inspect</span>
      <span class="instruction"><b>SCROLL</b> dolly</span>
      <span class="instruction"><b>R</b> reset</span>
    </div>
    <div class="torch-readout">
      <span class="status-led"></span>
      <span id="status">STILL</span>
      <span class="readout-sep">//</span>
      <span>TORCH 3200 K</span>
    </div>
  </div>

  <button id="flare" class="ui flare" type="button" aria-label="Disturb the space (F)">
    <span class="flare-icon" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
    <span class="flare-copy">
      <span class="flare-kicker">DISTURBANCE</span>
      <span class="flare-key">PRESS F</span>
    </span>
  </button>

  <div id="reticle" aria-hidden="true"><span></span></div>

  <div id="loader" class="ui" aria-live="polite">
    <div class="loader-inner">
      <div class="loader-eyebrow">NORTH DOCK · 03</div>
      <div class="loader-title">BAY 03</div>
      <div class="loader-line"><span></span></div>
      <div class="loader-note">adjusting to the dark</div>
    </div>
  </div>

  <noscript>
    <div class="noscript">This piece needs JavaScript and WebGL.</div>
  </noscript>

  <script type="module" src="./js/app.js"></script>
<script src="../camera-limits.js"></script><script src="../scene-ui.js?v=20261114"></script></body>
</html>
